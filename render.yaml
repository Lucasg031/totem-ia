# ── Totem IA — Render Blueprint ──────────────────────────────────
# Deploy: connect your GitHub repo to Render.com
# Render auto-detects this file and creates the service
# ──────────────────────────────────────────────────────────────────

services:
  - type: web
    name: totem-ia
    runtime: node
    region: ohio
    plan: free

    # Build: frontend → backend
    buildCommand: |
      cd frontend && npm ci && npm run build && \
      cd ../backend && npm ci && npm run build

    # Start: backend serves API + frontend static files
    startCommand: node backend/dist/index.js

    # Health check
    healthCheckPath: /api/health

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://totem-ia.onrender.com/api
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: ""

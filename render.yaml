services:
  - type: web
    name: totem-ia
    runtime: node
    region: ohio
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci && npm run build
    startCommand: node backend/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://totem-ia.onrender.com/api
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: ""

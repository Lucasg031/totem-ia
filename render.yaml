# ── Totem IA — Render Blueprint ──────────────────────────────────
# Deploy: connect your GitHub repo to Render.com
# Render auto-detects this file and creates the service
# ──────────────────────────────────────────────────────────────────

services:
  - type: web
    name: totem-ia
    env: docker
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://totem-ia.onrender.com/api
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: ""
